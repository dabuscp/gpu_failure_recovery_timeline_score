[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dabuscp-gpu_failure_recovery_timeline_score"
version = "0.1.0"
description = "解析时间标记，排列AIGC 内容生成工程师·GPU 故障与作业自愈的发生顺序，标出间隔异常与逆序事件"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "dabuscp" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://dabuscp.github.io"
Repository = "https://github.com/dabuscp/gpu_failure_recovery_timeline_score"
Issues = "https://github.com/dabuscp/gpu_failure_recovery_timeline_score/issues"

[project.scripts]
gpu_failure_recovery_timeline_score = "gpu_failure_recovery_timeline_score:main"

[tool.setuptools]
py-modules = ["gpu_failure_recovery_timeline_score"]
